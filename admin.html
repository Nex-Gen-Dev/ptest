<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaim's Portal | Secure Back Office</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #dadbd3; padding: 40px 20px; font-family: sans-serif; }
        .admin-card { max-width: 600px; margin: 0 auto 30px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
        .inquiry-item { background: #f8f9fa; border-left: 5px solid #00a884; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
        .inquiry-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: #667781; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div id="admin-login" class="admin-card">
        <h2 style="color: #008069;"><i class="fas fa-lock"></i> Author Login</h2>
        <p>Please sign in to access the dashboard.</p>
        <input type="email" id="admin-email" placeholder="Email Address">
        <input type="password" id="admin-password" placeholder="Password">
        <button onclick="handleLogin()" class="login-btn" style="width: 100%;">LOGIN</button>
        <p id="login-status" style="margin-top:10px; text-align:center;"></p>
    </div>

    <div id="admin-panel" class="hidden">
        
        <div class="admin-card">
            <h2 style="color: #008069;"><i class="fas fa-edit"></i> Create New Post</h2>
            <div class="poll-form">
                <label>Category</label>
                <select id="post-category">
                    <option value="vlogs">Vlogs</option>
                    <option value="blogs">Blogs</option>
                    <option value="promotions">Promotions</option>
                    <option value="polls">Polls</option>
                </select>
                <input type="text" id="post-title" placeholder="Post Title">
                <textarea id="post-body" rows="5" placeholder="YouTube Link or Message Content"></textarea>
                <button onclick="saveToSupabase()" class="login-btn" style="width: 100%;">PUBLISH TO WEBSITE</button>
                <p id="status-msg" style="margin-top: 15px; text-align: center; font-weight: bold;"></p>
            </div>
        </div>

        <div class="admin-card">
            <h2 style="color: #008069;"><i class="fas fa-inbox"></i> AI Inquiry Inbox</h2>
            <p style="color: #667781; margin-bottom: 20px;">Messages from your website visitors:</p>
            <div id="inbox-list">
                <p style="text-align: center; color: #888;">No messages yet.</p>
            </div>
            <button onclick="fetchInquiries()" class="login-btn" style="width: 100%; margin-top: 20px; background-color: #54656f;">
                <i class="fas fa-sync-alt"></i> REFRESH MESSAGES
            </button>
        </div>

        <div style="text-align: center;">
            <button onclick="handleLogout()" style="background:none; border:none; color:red; cursor:pointer; font-weight:bold;">LOGOUT</button>
        </div>
    </div>

    <script src="admin-script.js"></script>
</body>
</html>

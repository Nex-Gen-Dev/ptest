<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chaim's Portal | Secure Back Office</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #dadbd3; padding: 40px 20px; font-family: sans-serif; }
        .admin-card { max-width: 600px; margin: 0 auto 30px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        /* This hides sections until we need them */
        .hidden { display: none !important; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; }
    </style>
</head>
<body>

    <div id="admin-login" class="admin-card">
        <h2 style="color: #008069;"><i class="fas fa-lock"></i> Author Login</h2>
        <p>Enter the email and password you created in Supabase.</p>
        <input type="email" id="admin-email" placeholder="Your Email Address">
        <input type="password" id="admin-password" placeholder="Your Password">
        <button onclick="handleLogin()" class="login-btn" style="width: 100%;">LOGIN TO POST</button>
        <p id="login-status" style="margin-top:10px; text-align:center; font-weight: bold;"></p>
    </div>

    <div id="admin-panel" class="admin-card hidden">
        <h2 style="color: #008069;"><i class="fas fa-edit"></i> Create New Post</h2>
        <div class="poll-form">
            <label>Category</label>
            <select id="post-category">
                <option value="vlogs">Vlogs</option>
                <option value="blogs">Blogs</option>
                <option value="promotions">Promotions</option>
            </select>
            <input type="text" id="post-title" placeholder="Title">
            <textarea id="post-body" rows="5" placeholder="YouTube Link or Text"></textarea>
            <button onclick="saveToSupabase()" class="login-btn" style="width: 100%;">PUBLISH TO WEBSITE</button>
            <p id="status-msg" style="margin-top: 15px; text-align: center; font-weight: bold;"></p>
        </div>
        <hr style="margin: 20px 0;">
        <button onclick="handleLogout()" style="background:none; border:none; color:red; cursor:pointer;">Logout</button>
    </div>

    <script src="admin-script.js"></script>
</body>
</html>

<li><a href="#polls">Create Poll</a></li>

<section id="polls" class="content-section">
    <h2>Poll Management</h2>
    <div class="poll-container">
        <div class="poll-form">
            <label>Poll Title</label>
            <input type="text" id="pollTitle" placeholder="Poll test">

            <label>Poll Image (Optional)</label>
            <input type="text" id="pollImageUrl" placeholder="Image URL">
            <button class="btn-secondary"><i class="fas fa-upload"></i> Upload Image</button>

            <label>Poll Type</label>
            <select id="pollType">
                <option value="multiple">Multiple Choice</option>
                <option value="rating">Rating</option>
            </select>

            <div class="options-header">
                <label>Options</label>
                <button type="button" class="btn-text" onclick="addOption()"><i class="fas fa-plus"></i> Add Option</button>
            </div>
            <div id="optionsList">
                <input type="text" class="poll-option" placeholder="One">
                <input type="text" class="poll-option" placeholder="Two">
            </div>

            <div class="toggle-container">
                <label class="switch">
                    <input type="checkbox" id="multipleSelections">
                    <span class="slider round"></span>
                </label>
                <span>Allow multiple selections</span>
            </div>

            <label>Expiration Date (Optional)</label>
            <input type="date" id="expiryDate">

            <label>Status</label>
            <select id="pollStatus">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
            
            <button class="btn" style="width: 100%; margin-top: 20px;">Create Poll</button>
        </div>
    </div>
</section>
